<html>
  <head>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  </head>

  <body>
    <div class="container">
      <div class="row">
        <div class="d-flex justify-content-center py-3">
          <ul class="nav nav-pills">
            <li class="nav-item">
              <a class="nav-link active" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Register Product</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Product Catalogue</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
          </ul>
        </div>
      </div>

      <div class="row">
        <div
          class="mt-4 col-lg-6 col-sm-12 justify-content-center"
          data-aos="fade-right"
        >
          <img
            src="/Volumes/My Disk 2/Java Files/Java-Fundamental-Projects/Advanced Web Development/Demo-project-Day-06/frontend/asset/img/banner-bun.png"
            width="100%"
          />
        </div>

        <div class="mt-4 col-lg-6 col-sm-12">
          <div class="mt-4">
            <label class="form-label" for="txt-product-name"
              >Product Name</label
            >
            <input
              class="form-control"
              id="txt-product-name"
              type="text"
              class="form-control"
            />
          </div>

          <div class="mt-4">
            <label class="form-label" for="txt-product-description"
              >Product Description</label
            >
            <input
              class="form-control"
              id="txt-product-description"
              type="text"
              class="form-control"
            />
          </div>

          <div class="mt-4">
            <label class="form-label" for="txt-product-category"
              >Product category</label
            >
            <select class="form-select" id="txt-product-category">
              <option>Bun</option>
              <option>Beverage</option>
            </select>
          </div>

          <div class="mt-4">
            <button class="btn btn-primary mt-3">Register Product</button>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init({
        duration: 3000,
      });
    </script>
  </body>
</html>
