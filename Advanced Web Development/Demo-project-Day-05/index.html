<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="container">
          <header class="d-flex justify-content-center py-3">
            <ul class="nav nav-pills">
              <li class="nav-item">
                <a href="#" class="nav-link active" aria-current="page">Home</a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link">Register</a>
              </li>
              <li class="nav-item">
                <a href="#" class="nav-link">Students</a>
              </li>
              <li class="nav-item"><a href="#" class="nav-link">FAQs</a></li>
              <li class="nav-item"><a href="#" class="nav-link">About</a></li>
            </ul>
          </header>
        </div>
      </div>

      <div class="row" style="margin-top: 50px">
        <div class="col-lg-6 col-sm-12 justify-content-center">
          <img
            src="asset/img/image.png"
            height="50%"
            width="auto"
            class="img-fluid"
            alt="Student Registration"
            style="justify-content: center"
          />
        </div>

        <div class="col-lg-6 col-sm-12">
          <div>
            <label for="first-name" class="form-label">First name</label>
            <input type="text" class="form-control" id="first-name" />
          </div>

          <div class="mt-4">
            <label for="last-name" class="form-label">Last name</label>
            <input type="text" class="form-control" id="last-name" />
          </div>

          <div class="mt-4">
            <label for="province" class="form-label">Select Province</label>
            <select
              class="form-select"
              id="province"
              aria-label="Default select example"
            >
              <option selected>Select Province</option>
              <option>Western</option>
              <option>Southern</option>
              <option>Eastern</option>
            </select>
          </div>

          <div class="mt-4">
            <button id="btn-register" class="btn btn-primary">Register</button>
          </div>
        </div>
      </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
      <div
        id="liveToast"
        class="toast"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="toast-header">
          <img width="20px" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTfz3upZJUzgki4bn27faJf6gPIIo7Yo5HxZg&s" class="rounded me-2" alt="..." />
          <strong class="me-auto">Notification</strong> 
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="toast"
            aria-label="Close"
          ></button>
        </div>
        <div class="toast-body">Student Registered Successfully!</div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script src="asset/js/app.js"></script>
  </body>
</html>
